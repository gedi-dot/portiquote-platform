# Staging: staging.portiquote.com
#
# Same as the production snippet on different ports, plus two things that keep
# staging out of public view. Install as BOTH:
#
#   /usr/local/directadmin/data/users/<user>/domains/staging.portiquote.com.cust_nginx_ssl.conf
#   /usr/local/directadmin/data/users/<user>/domains/staging.portiquote.com.cust_nginx.conf
#
# Then:
#
#   cd /usr/local/directadmin/custombuild && ./build rewrite_confs
#   nginx -t && systemctl reload nginx
#
# See the production snippet for the notes about DirectAdmin owning the server
# block and about never installing Ubuntu's nginx package.

# Applies to every location below, including the proxied ones: a staging copy of
# a live marketplace must not end up in a search index competing with production.
# The app also serves production canonical URLs here by design (see lib/site.ts),
# which makes indexing it actively harmful.
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

# ---------------------------------------------------------------- Supabase ----
# Basic auth is deliberately NOT applied to these. supabase-js sends its own
# Authorization header for the user's JWT, and a browser cannot send two; adding
# basic auth here would break sign-in and every API read. They are protected by
# being loopback-only upstream plus the JWT each service verifies for itself.
location /auth/v1/ {
    proxy_pass http://127.0.0.1:8410;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /rest/v1/ {
    proxy_pass http://127.0.0.1:8410;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /realtime/v1/ {
    proxy_pass http://127.0.0.1:8410;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --------------------------------------------------------------------- app ----
location / {
    auth_basic           "PortiQuote staging";
    auth_basic_user_file /etc/nginx/portiquote-staging.htpasswd;

    proxy_pass http://127.0.0.1:3410;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
}

# Let's Encrypt renewal must not be behind the password, or the certificate will
# silently stop renewing and the site will expire in 90 days.
location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    root /var/www/html;
    try_files $uri =404;
}
