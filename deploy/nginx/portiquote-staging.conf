# Staging: staging.portiquote.com
#
# Install it, note the deliberate lack of a file extension, then reload:
#
#   install -o root -g root -m 644 portiquote-staging.conf \
#       /etc/nginx/sites-available/portiquote-staging
#   ln -sfn /etc/nginx/sites-available/portiquote-staging \
#       /etc/nginx/sites-enabled/portiquote-staging
#   nginx -t && systemctl reload nginx
#
# A standalone server block, NOT a DirectAdmin custom config. staging is
# deliberately not a DirectAdmin domain — it is only a DNS record — so DirectAdmin
# generates no vhost for it and has nowhere to inline a .cust_nginx file. With no
# vhost, requests fall through to whichever server block is default, which on this
# box is another customer's site serving its own certificate.
#
# It goes in sites-enabled because that is what /etc/nginx/nginx-includes.conf
# actually globs:
#
#   include /etc/nginx/sites-enabled/*;
#   include /etc/nginx/conf.d/tool_perxli.conf;
#
# Note /etc/nginx/conf.d/ is NOT globbed — tool_perxli.conf is included by name.
# A file dropped into conf.d is silently ignored. And because sites-enabled globs
# EVERYTHING, never leave a backup copy in there: a portiquote-staging.bak would
# be loaded as live config, duplicating the server block.
#
# DirectAdmin does not rewrite either path, so this survives
# `./build rewrite_confs` — unlike a .cust_nginx file, which is regenerated.
#
# TLS comes from portiquote.com's DirectAdmin certificate, which is a WILDCARD
# (*.portiquote.com) and so already covers this name and keeps covering it across
# renewals. Nothing to issue, and no ACME challenge exemption needed.
#
# nginx on this server must stay DirectAdmin's CustomBuild build. Ubuntu's package
# is apt-held after it once overwrote it and took every site down.

server {
    listen 158.220.113.77:80;
    server_name staging.portiquote.com;

    # Everything real is on HTTPS, and the app sets secure cookies.
    return 301 https://$host$request_uri;
}

server {
    listen 158.220.113.77:443 ssl;
    server_name staging.portiquote.com;

    ssl_certificate     /usr/local/directadmin/data/users/admin/domains/portiquote.com.cert.combined;
    ssl_certificate_key /usr/local/directadmin/data/users/admin/domains/portiquote.com.key;
    # ssl_protocols and ssl_ciphers are deliberately not repeated here: they are
    # already set in DirectAdmin's http context, and restating them on a shared
    # listen socket is what produces nginx's "protocol options redefined" warnings.

    access_log /var/log/nginx/staging.portiquote.com.log;
    error_log  /var/log/nginx/staging.portiquote.com.error.log;

    client_max_body_size 8m;

    # A staging copy of a live marketplace must not reach a search index. The app
    # also serves production's canonical URLs here by design (see lib/site.ts),
    # which would make an indexed staging actively harmful. Inherited by the
    # locations below, none of which set add_header of their own.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # ---------------------------------------------------------------- Supabase --
    # Same-origin for the browser; the path is passed through unchanged, because
    # the gateway container expects the prefix and strips it itself.
    #
    # Basic auth is deliberately NOT applied to these. supabase-js sends the
    # user's JWT in Authorization, and a browser cannot send two Authorization
    # headers — adding basic auth here would break sign-in and every API read.
    # They are protected by the gateway being loopback-only and by each service
    # verifying the JWT for itself.
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:8410;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:8410;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket. Without the upgrade headers the three live message threads fall
    # back to nothing and simply never update.
    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:8410;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------- app --
    location / {
        auth_basic           "PortiQuote staging";
        # Not under /etc/nginx: that directory is not traversable by the nginx
        # worker user here, and this file is opened by the WORKER on each request,
        # not by the root master at startup. Putting it there gives
        # "Permission denied" and a 500 on every authenticated request.
        auth_basic_user_file /etc/portiquote/staging.htpasswd;

        proxy_pass http://127.0.0.1:3410;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next streams its responses; buffering defeats that and delays the first
        # byte until the whole page is ready.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
