# The single address for one environment's Supabase services, replacing the Kong
# gateway that upstream's docker-compose ships. Mounted read-only into the
# `gateway` container at /etc/nginx/conf.d/default.conf.
#
# The path prefixes are not ours to choose: supabase-js takes one base URL and
# appends /auth/v1, /rest/v1 and /realtime/v1 to it. Those prefixes are stripped
# here, because each upstream serves from its own root.
#
# Nothing authenticates or authorises in this file. GoTrue, PostgREST and
# Realtime each verify the JWT themselves against the shared JWT_SECRET, and
# PostgREST switches Postgres role per request so Row Level Security applies.
# The gateway only routes. It listens on loopback via the host port mapping, so
# it is never directly reachable from outside the server.

# Docker's embedded DNS, with a short TTL and upstreams named through variables
# so a container that comes back on a different IP is picked up rather than
# cached until the gateway is reloaded.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8000;
    server_name _;

    # Matches the app's own limit; large RFQ payloads are JSON, not uploads.
    client_max_body_size 8m;

    # Off by default in nginx:alpine's stock config only for proxied responses;
    # set explicitly so a slow PostgREST query is not buffered to disk.
    proxy_buffering off;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # ------------------------------------------------------------------ auth --
    location /auth/v1/ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        set $upstream_auth auth:9999;
        proxy_pass http://$upstream_auth;
    }

    # ------------------------------------------------------------------ rest --
    location /rest/v1/ {
        rewrite ^/rest/v1/(.*)$ /$1 break;
        set $upstream_rest rest:3000;
        proxy_pass http://$upstream_rest;
    }

    # -------------------------------------------------------------- realtime --
    # Realtime serves its socket under /socket, so this is a rename rather than a
    # plain prefix strip. Needs the WebSocket upgrade headers and a long read
    # timeout: an idle subscription must not be cut off mid-conversation.
    location /realtime/v1/ {
        rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
        set $upstream_realtime realtime:4000;
        proxy_pass http://$upstream_realtime;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Anything else is a mistake — a missing prefix or a probe. Say so plainly
    # rather than passing it to an upstream that would answer confusingly.
    location / {
        return 404 '{"error":"no such Supabase endpoint"}';
        default_type application/json;
    }
}
