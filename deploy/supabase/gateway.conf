# The single address for one environment's Supabase services, replacing the Kong
# gateway that upstream's docker-compose ships. Mounted read-only into the
# `gateway` container as /etc/nginx/templates/default.conf.template; the image's
# entrypoint renders it into conf.d at start, substituting only the PQ_*
# variables (see compose.yaml). Anything else that looks like ${NAME} is left
# alone, and nginx's own $variables are never touched.
#
# The path prefixes are not ours to choose: supabase-js takes one base URL and
# appends /auth/v1, /rest/v1 and /realtime/v1 to it. Those prefixes are stripped
# here, because each upstream serves from its own root.
#
# Authorisation is not done here. GoTrue, PostgREST and Realtime each verify the
# JWT themselves against the shared JWT_SECRET, and PostgREST switches Postgres
# role per request so Row Level Security applies. The one thing the gateway does
# check is the API key on /rest/v1, below. It listens on loopback via the host
# port mapping, so it is never directly reachable from outside the server.

# ---------------------------------------------------------------- API key --
# PostgREST answers an anonymous request as the `anon` role, so without this
# anyone could fetch /rest/v1/ and read the generated OpenAPI description of
# every exposed table and column. Upstream's Kong refuses a request that carries
# neither key; this does the same.
#
# supabase-js always sends the key in an `apikey` header; the query parameter is
# accepted too, as Kong does. The key only says which project the caller means;
# it grants nothing beyond what the anon role and RLS already allow.
#
# The keys are JWTs of ~200 characters; nginx's default 64-byte map bucket
# cannot hold one, and the gateway then refuses to start ("could not build
# map_hash"). 512 leaves room for longer claims.
map_hash_bucket_size 512;

map $http_apikey $apikey {
    ""      $arg_apikey;
    default $http_apikey;
}

map $apikey $apikey_valid {
    default                   0;
    "${PQ_ANON_KEY}"          1;
    "${PQ_SERVICE_ROLE_KEY}"  1;
}

# Docker's embedded DNS, with a short TTL and upstreams named through variables
# so a container that comes back on a different IP is picked up rather than
# cached until the gateway is reloaded.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8000;
    server_name _;

    # Matches the app's own limit; large RFQ payloads are JSON, not uploads.
    client_max_body_size 8m;

    # Off by default in nginx:alpine's stock config only for proxied responses;
    # set explicitly so a slow PostgREST query is not buffered to disk.
    proxy_buffering off;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # NOTE ON ORDERING in every block below: `set` comes BEFORE `rewrite`.
    # `rewrite ... break` stops the rewrite module, and `set` belongs to that
    # module, so a `set` placed after it never runs — leaving an empty variable
    # and `invalid URL prefix in "http://"`, which surfaces as a bare nginx 500.

    # ------------------------------------------------------------------ auth --
    location /auth/v1/ {
        set $upstream_auth auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream_auth;
    }

    # ------------------------------------------------------------------ rest --
    location /rest/v1/ {
        # Kong's body for a missing key, used for a wrong one too.
        default_type application/json;
        if ($apikey_valid = 0) {
            return 401 '{"message":"No API key found in request"}';
        }
        set $upstream_rest rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream_rest;
    }

    # -------------------------------------------------------------- realtime --
    # Realtime serves its socket under /socket, so this is a rename rather than a
    # plain prefix strip. Needs the WebSocket upgrade headers and a long read
    # timeout: an idle subscription must not be cut off mid-conversation.
    #
    # Realtime is multi-tenant and takes the tenant from the first label of the
    # Host header. SEED_SELF_HOST seeds exactly one, `realtime-dev`, and upstream
    # only gets it right by naming its container realtime-dev.supabase-realtime.
    # Left at nginx's default the Host is `realtime:4000`, and every socket is
    # refused with TenantNotFound — as a plain 404, so it looks like routing.
    location /realtime/v1/ {
        set $upstream_realtime realtime:4000;
        rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
        proxy_pass http://$upstream_realtime;

        proxy_set_header Host       realtime-dev.supabase-realtime;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Anything else is a mistake — a missing prefix or a probe. Say so plainly
    # rather than passing it to an upstream that would answer confusingly.
    location / {
        return 404 '{"error":"no such Supabase endpoint"}';
        default_type application/json;
    }
}
