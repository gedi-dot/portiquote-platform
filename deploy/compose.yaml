# One PortiQuote environment: its own Postgres, auth, API, realtime and web.
#
# Installed to /opt/portiquote/<env>/compose.yaml by setup-server.sh, root-owned.
# It deliberately lives OUTSIDE any git checkout: the deploy runs as root, so a
# compose file taken straight from the repository would let anyone with push
# access mount the host filesystem into a root-run container.
#
# Two environments run side by side from identical copies of this file, told
# apart only by their .env — different ports, different secrets, different data
# directory. `name` is per-environment so Compose keeps them separate.
#
# The web image is never built here. It is built once by
# .github/workflows/release.yml, published to GHCR, and promoted between
# environments by tag, so staging and production can run byte-identical code.
#
# Memory: every service is capped, because this box also hosts other customers'
# containers and has only 2G of swap. The defaults add up to about 2.2G per
# environment; staging is expected to set the smaller values in its .env.

name: portiquote-${APP_ENV:?set APP_ENV in .env}

services:
  # ---------------------------------------------------------------- database --
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    # No host port. Nothing outside this network needs Postgres, and the deploy
    # reaches it with `docker compose exec db psql` when applying migrations.
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PORT: 5432
      PGPORT: 5432
      PGDATABASE: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      # Roles and the JWT expiry GUC. Run once, on an empty data directory only.
      - ./supabase/init-scripts/99-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/init-scripts/99-jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./supabase/migrations/99-realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      # The app's own schema, extracted from the release image by the deploy so
      # that image and migrations can never disagree about a version.
      - ./migrations:/migrations:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: ${MEM_DB:-768m}
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # -------------------------------------------------------------------- auth --
  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      # Must be the address the BROWSER uses, because it is what GoTrue signs
      # tokens with and puts in the links it emails.
      API_EXTERNAL_URL: ${APP_ORIGIN:?missing in .env}
      GOTRUE_JWT_ISSUER: ${APP_ORIGIN}/auth/v1
      GOTRUE_SITE_URL: ${APP_ORIGIN}
      GOTRUE_URI_ALLOW_LIST: ${APP_ORIGIN}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?missing in .env}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # false = the user must click the link in the email before the account
      # works. Signup confirmation is the whole point of wiring up SMTP.
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:?missing in .env}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:?missing in .env}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:?missing in .env}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_USER}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-PortiQuote}
      # Paths on OUR site, not GoTrue's. The app handles the code exchange.
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/callback
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/callback
      GOTRUE_MAILER_URLPATHS_RECOVERY: /reset-password
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    mem_limit: ${MEM_AUTH:-192m}
    logging: *logging

  # -------------------------------------------------------------------- rest --
  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      # `authenticator` starts with no rights and switches to the role named in
      # the request's JWT, which is how Row Level Security ends up applying.
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_ADMIN_SERVER_PORT: 3001
    command: ["postgrest"]
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    mem_limit: ${MEM_REST:-192m}
    logging: *logging

  # ---------------------------------------------------------------- realtime --
  # Carries the three live message threads: DirectThread, ForwarderMessage and
  # MessageThread. Drop this service and those stop updating without a reload.
  realtime:
    image: supabase/realtime:v2.134.10
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?missing in .env}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?missing in .env}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    mem_limit: ${MEM_REALTIME:-384m}
    logging: *logging

  # ----------------------------------------------------------------- gateway --
  # Gives Supabase ONE address, which is what supabase-js expects: it appends
  # /auth/v1 and /rest/v1 to a single base URL. Upstream ships Kong for this;
  # nginx does the same routing in a 12MB image, and DirectAdmin's nginx is
  # already the public front door, so a second full API gateway earns nothing.
  #
  # The browser reaches these paths same-origin via DirectAdmin's nginx; the app
  # container reaches them directly as http://gateway:8000.
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_healthy }
    volumes:
      - ./supabase/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${PORT_SUPABASE:?missing in .env}:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8000/auth/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: ${MEM_GATEWAY:-64m}
    logging: *logging

  # --------------------------------------------------------------------- web --
  web:
    image: ${IMAGE:?missing in .env}:${IMAGE_TAG:?missing in .env}
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
    env_file: .env
    environment:
      # Overrides .env: the container always listens on 3000, and the host side
      # is chosen by PORT_APP below.
      PORT: "3000"
      # Server-side calls stay inside this network — they never leave the box and
      # so are not subject to staging's basic auth.
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: ${ANON_KEY:?missing in .env}
    # Loopback only. The public side is DirectAdmin's nginx, which owns the
    # domain and its Let's Encrypt certificate and proxies to this port.
    ports:
      - "127.0.0.1:${PORT_APP:?missing in .env}:3000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${MEM_WEB:-640m}
    logging: *logging
