<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Browser-tab icon: the interlocked-containers mark on an ink tile.
       The second box uses tide (#16B3A6) rather than sea (#0B4A54), which sits
       too close to ink to read at 16px. Same weave technique as the main mark:
       painting order, plus one redrawn edge segment, no masks or ids.
       Crossings verified at (20,13) saffron-over and (12,19) tide-over. -->
  <rect width="32" height="32" rx="7" fill="#062A2E"/>
  <rect x="6" y="5" width="14" height="14" rx="4" fill="none" stroke="#16B3A6" stroke-width="3"/>
  <rect x="12" y="13" width="14" height="14" rx="4" fill="none" stroke="#F2A83B" stroke-width="3"/>
  <path d="M 10 19 H 15" fill="none" stroke="#16B3A6" stroke-width="3"/>
</svg>
