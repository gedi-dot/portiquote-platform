<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icon: the route mark on an ink tile. Saffron on ink has far more
       contrast than it would on the light navbar, so the mark carries at 16px.
       Scaled to 0.85 rather than filling the tile, so the arrowhead does not
       collide with the rounded corners. -->
  <rect width="32" height="32" rx="7" fill="#062A2E"/>
  <g transform="translate(2.4,5.4) scale(0.85)" fill="none">
    <path d="M 3 20.5 C 7 8, 16 4.5, 22 8" stroke="#F2A83B" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 18 2.5 L 30 9 L 18 15.5 Z" fill="#F2A83B"/>
  </g>
</svg>
