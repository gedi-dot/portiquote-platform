<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Browser-tab icon. The site had no favicon at all before this, so tabs
       showed a blank default. On the dark ink tile, the mark uses tide rather
       than sea for the second ring: sea (#0B4A54) is too close to ink to read
       at 16px. The weave is dropped here because it is invisible at tab size —
       clean layering is more robust. -->
  <rect width="32" height="32" rx="7" fill="#062A2E"/>
  <circle cx="21" cy="16" r="7.5" fill="none" stroke="#F2A83B" stroke-width="3"/>
  <circle cx="11" cy="16" r="7.5" fill="none" stroke="#16B3A6" stroke-width="3"/>
</svg>
