<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icon. The logo is a two-tone wordmark with no symbol, so the icon is
       the letter the colour break lands on — the P of "Pair", saffron on ink.
       Drawn as a path rather than <text> so it never depends on a font being
       available, and with a deliberately generous counter: at 16px a tighter
       bowl fills in and the letter reads as a blob. Verified open at 16 and 32. -->
  <rect width="32" height="32" rx="7" fill="#062A2E"/>
  <path fill-rule="evenodd" fill="#F2A83B"
        d="M 9 6 H 18 A 6.5 6.5 0 0 1 18 19 H 15 V 26 H 9 Z
           M 15 10.5 H 18 A 2 2 0 0 1 18 14.5 H 15 Z"/>
</svg>
